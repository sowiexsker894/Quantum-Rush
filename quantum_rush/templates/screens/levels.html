<!-- ========== MAPA DE PLANETAS ========== -->
<section id="screen-map" class="screen levels">
  <header class="landing-nav">
    <button class="brand brand-btn" id="btn-home">
      <svg viewBox="0 0 24 24" class="brand-icon"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
      QUANTUM <span>RUSH</span>
    </button>
    <div class="nav-status">
      <span class="status-dot"></span> <span id="lv-done">0</span>/3 NIVELES
      <span class="nav-stars">
        <svg viewBox="0 0 24 24"><path d="M12 2 L14.6 8.6 L21.5 9.2 L16.2 13.8 L17.8 20.6 L12 17 L6.2 20.6 L7.8 13.8 L2.5 9.2 L9.4 8.6 Z"/></svg>
        <span id="stars-count">0</span>/9
      </span>
      <button class="nav-sound sound-btn" aria-label="Activar o silenciar la música" title="Música">
        <svg viewBox="0 0 24 24"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z"/><path class="waves" d="M16.5 8.5 C18.5 10.5 18.5 13.5 16.5 15.5 M19 6 C22.3 9.3 22.3 14.7 19 18"/></svg>
      </button>
    </div>
  </header>

  <div class="levels-body">
    <div class="levels-head">
      <div>
        <p class="kicker"><span class="kicker-line"></span> CENTRO DE MANDO · SELECCIÓN DE NIVEL</p>
        <h2 class="briefing-title">ELIGE TU <span>MISIÓN</span></h2>
      </div>
      <div class="nova-comm">
        <img src="{{ url_for('static', filename='img/characters/nova-robot.png') }}" alt="NOVA">
        <div class="comm-bubble">
          <span class="comm-label">NOVA · TRANSMISIÓN</span>
          <p id="map-bubble"></p>
        </div>
      </div>
    </div>

    <div class="level-grid" id="planet-grid"></div>

    <div class="levels-foot">
      <span class="legend-item"><i class="dot q"></i> Cuántica</span>
      <span class="legend-item"><i class="dot s"></i> Estadística</span>
      <span class="legend-item"><i class="dot m"></i> Machine Learning</span>
      <button class="btn-text" id="btn-see-briefing">Ver objetivos de la misión</button>
    </div>
  </div>
</section>
